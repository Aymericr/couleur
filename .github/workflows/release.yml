name: Release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing, reviewed version tag (for example v1.0.0)'
        required: true
        type: string
      publish:
        description: 'Publish after notarization and verification (otherwise create a draft)'
        default: false
        type: boolean
permissions:
  contents: write
concurrency:
  group: couleur-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: macos-15
    environment: release
    steps:
      - name: Validate tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: '[[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]'
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - name: Install signing credentials in a temporary Keychain
        env:
          CERTIFICATE_P12: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_KEY: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          for name in CERTIFICATE_P12 CERTIFICATE_PASSWORD NOTARY_KEY NOTARY_KEY_ID NOTARY_ISSUER_ID; do
            [[ -n "${!name}" ]] || { echo "Missing release secret: $name" >&2; exit 1; }
          done
          keychain="$RUNNER_TEMP/couleur-signing.keychain-db"
          password=$(openssl rand -base64 32)
          echo "::add-mask::$password"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/couleur.p12"
          security import "$RUNNER_TEMP/couleur.p12" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db
          printf '%s' "$NOTARY_KEY" > "$RUNNER_TEMP/notary.p8"
          xcrun notarytool store-credentials CouleurCI --key "$RUNNER_TEMP/notary.p8" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" --keychain "$keychain"
      - name: Build, notarize, staple and verify
        env:
          COULEUR_NOTARY_PROFILE: CouleurCI
          COULEUR_NOTARY_KEYCHAIN: ${{ runner.temp }}/couleur-signing.keychain-db
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          [[ -n "$SPARKLE_PRIVATE_KEY" ]] || { echo 'Missing SPARKLE_PRIVATE_KEY' >&2; exit 1; }
          ./scripts/package-release.sh
      - name: Upload verified release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          mode=--draft
          [[ "$PUBLISH" != true ]] || mode=--publish
          ./scripts/publish-release.sh "${RELEASE_TAG#v}" "$mode"
      - name: Update the Homebrew cask after publication
        if: inputs.publish
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          cp "build/releases/${RELEASE_TAG#v}/couleur.rb" "$RUNNER_TEMP/couleur.rb"
          git switch main
          git pull --ff-only origin main
          mkdir -p Casks
          cp "$RUNNER_TEMP/couleur.rb" Casks/couleur.rb
          ruby -c Casks/couleur.rb
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Casks/couleur.rb
          git diff --cached --quiet || git commit -m "Update Homebrew cask to ${RELEASE_TAG#v}"
          git push origin main
      - name: Preserve notarization reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: notarization-reports
          path: build/notarization/
          if-no-files-found: ignore
      - name: Remove signing credentials
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/couleur-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/couleur.p12" "$RUNNER_TEMP/notary.p8"
