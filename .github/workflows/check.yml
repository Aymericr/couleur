name: Check
on: [push, pull_request]
jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        run: swift test
      - name: Package app
        run: ./scripts/build.sh release
      - uses: actions/upload-artifact@v4
        with:
          name: Couleur-macOS
          path: build/Couleur.app
