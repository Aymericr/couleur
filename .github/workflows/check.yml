name: Check
on: [push, pull_request]
jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        run: swift test
      - name: Package app
        run: |
          ./scripts/build.sh release universal
          ditto -c -k --sequesterRsrc --keepParent build/Couleur.app build/Couleur-macOS.zip
      - uses: actions/upload-artifact@v7
        with:
          name: Couleur-macOS
          path: build/Couleur-macOS.zip
      - name: Validate release tooling
        run: |
          bash -n scripts/*.sh
          python3 -m py_compile scripts/release-metadata.py scripts/check-release-version.py
