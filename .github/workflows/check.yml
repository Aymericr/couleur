name: Check
on: [push, pull_request]
jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        run: swift test
      - name: Package app
        run: |
          ./scripts/build.sh release
          ditto -c -k --sequesterRsrc --keepParent build/Couleur.app build/Couleur-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Couleur-macOS
          path: build/Couleur-macOS.zip
